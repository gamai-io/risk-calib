[package]
name = "router_rust"
version = "0.1.0"
edition = "2021"

# Dva binarna fajla:
#   1) router_rust  — CLI (batč/bench), isti format kao Go
#   2) router_sidecar — TOPLI proces (NDJSON preko stdio), za Python most
# Logika je u router.rs (modul).
[[bin]]
name = "router_rust"
path = "main.rs"

[[bin]]
name = "router_sidecar"
path = "sidecar.rs"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
